model_name: Purchasing Model

fact:
  name: fact_purchases
  catalog: testdata
  schema: gold
  table: fact_purchases
  join_keys:
    - date_key
    - product_key
    - supplier_key
    - buyer_key
  metrics:
    - name: unit_cost
      label: Unit Cost
      type: numeric
      default_agg: avg
      allowed_aggs: [sum, avg, min, max, count]
    - name: quantity
      label: Quantity
      type: numeric
      default_agg: sum
      allowed_aggs: [sum, avg, min, max, count]
    - name: freight_cost
      label: Freight Cost
      type: numeric
      default_agg: sum
      allowed_aggs: [sum, avg, min, max, count]
    - name: total_cost
      label: Total Cost
      type: numeric
      default_show: true      
      default_agg: sum
      allowed_aggs: [sum, avg, min, max, count]

dimensions:
  - name: Date
    catalog: testdata
    schema: gold
    table: dim_purchase_date
    fact_key: date_key
    dim_key: date_key
    display_key: date_dim_key
    default_show: true
    attributes:
      - name: year
        label: Year
        type: integer
        default_show: true
      - name: quarter
        label: Quarter
        type: string
      - name: month
        label: Month
        type: integer

  - name: Product
    catalog: testdata
    schema: gold
    table: dim_purchase_product
    fact_key: product_key
    dim_key: product_key
    display_key: product_dim_key
    attributes:
      - name: brand
        label: Brand
        type: string
      - name: product_name
        label: Product Name
        type: string
      - name: category
        label: Category
        type: string

  - name: Supplier
    catalog: testdata
    schema: gold
    table: dim_supplier
    fact_key: supplier_key
    dim_key: supplier_key
    display_key: supplier_dim_key
    attributes:
      - name: supplier_name
        label: Supplier Name
        type: string
      - name: supplier_region
        label: Supplier Region
        type: string
      - name: supplier_tier
        label: Tier
        type: string

  - name: Buyer
    catalog: testdata
    schema: gold
    table: dim_buyer
    fact_key: buyer_key
    dim_key: buyer_key
    display_key: buyer_dim_key
    attributes:
      - name: buyer_name
        label: Buyer Name
        type: string
      - name: department
        label: Department
        type: string
      - name: buyer_region
        label: Location
        type: string
