# OLAP Model Definition
# Describes the star-schema: one fact table, multiple dimension tables,
# their columns, metrics, and join relationships.
# The database layer reads this file and the frontend is driven entirely
# by the metadata it exposes — no schema knowledge is hard-coded in app.py.

model_name: Sales Model

fact:
  name: fact_sales
  catalog: testdata
  schema: gold
  table: fact_sales
  # surrogate keys used only for joins — hidden in the UI
  join_keys:
    - date_key
    - product_key
    - customer_key
  metrics:
    - name: sales_amount
      label: Sales Amount
      type: numeric
      default_agg: sum
      allowed_aggs: [sum, avg, min, max, count]
    - name: quantity
      label: Quantity
      type: numeric
      default_agg: sum
      allowed_aggs: [sum, avg, min, max, count]

dimensions:
  - name: Date
    catalog: testdata
    schema: gold
    table: dim_date
    # Column in the fact table that references this dimension
    fact_key: date_key
    # Column in the dimension table that is the primary key
    dim_key: date_key
    # Synthetic display key exposed in the UI (alias of dim_key)
    display_key: date_dim_key
    attributes:
      - name: year
        label: Year
        type: integer
      - name: quarter
        label: Quarter
        type: string
      - name: month
        label: Month
        type: integer

  - name: Product
    catalog: testdata
    schema: gold
    table: dim_product
    fact_key: product_key
    dim_key: product_key
    display_key: product_dim_key
    attributes:
      - name: product_name
        label: Product Name
        type: string
      - name: category
        label: Category
        type: string
      - name: brand
        label: Brand
        type: string

  - name: Customer
    catalog: testdata
    schema: gold
    table: dim_customer
    fact_key: customer_key
    dim_key: customer_key
    display_key: customer_dim_key
    attributes:
      - name: customer_name
        label: Customer Name
        type: string
      - name: segment
        label: Segment
        type: string
      - name: region
        label: Region
        type: string
